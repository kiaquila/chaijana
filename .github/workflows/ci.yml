name: Project CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Dependency advisories appear without a push, so osv-scan needs its own beat.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name is part of the group because a Monday scan and a push to
  # main both resolve `github.ref` to refs/heads/main, and one would otherwise
  # cancel the other. Superseding is only wanted on a pull request, where a new
  # push makes the previous run's verdict irrelevant; a main build and a
  # scheduled scan each need to finish.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  project-ci:
    name: project-ci
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      # `check:website` runs `npm ci --prefix website` itself, so a contributor
      # runs the same command locally that CI runs here.
      - name: Run the menu and website checks
        run: npm run check:project

  repository-guard:
    name: repository-guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      # Invoked directly rather than through `npm run`, so this job cannot be
      # neutered by editing the root package.json in the same pull request.
      # The guard has no dependencies, so there is nothing to install and
      # nothing from the proposed tree runs with more than `contents: read`.
      - name: Check repository safety
        run: node scripts/check-repository.mjs

      - name: Test the repository guard
        run: node --test tests/*.test.mjs

  osv-scan:
    name: osv-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            .
